<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能图片处理工具 · 文字提取 / 修改 / 物体替换</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🖼️</span>
      <div>
        <h1>智能图片处理工具</h1>
        <p class="sub">文字提取 · 文字修改 · 自由替换图中任意事物（不改原图）</p>
      </div>
    </div>
    <button id="openSettings" class="btn ghost">⚙️ AI 设置</button>
  </header>

  <main class="wrap">
    <!-- 上传区 -->
    <section class="card uploader" id="uploader">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*" hidden />
        <div class="drop-inner">
          <div class="big">⬆️ 点击或拖拽图片到此处</div>
          <div class="hint">支持 PNG / JPG / WEBP，所有处理均在浏览器或你的密钥下完成</div>
        </div>
      </label>
      <div class="upload-actions" id="uploadActions" style="display:none">
        <span id="fileName" class="fname"></span>
        <button class="btn small" id="changeImg">更换图片</button>
      </div>
    </section>

    <!-- 画布区 -->
    <section class="card stage-card" id="stageCard" style="display:none">
      <div class="tabs">
        <button class="tab active" data-tab="ocr">① 文字提取</button>
        <button class="tab" data-tab="edit">② 文字修改</button>
        <button class="tab" data-tab="replace">③ 物体替换</button>
      </div>

      <div class="stage-wrap">
        <div class="canvas-box" id="canvasBox">
          <canvas id="stage"></canvas>
          <canvas id="overlay"></canvas>
        </div>
        <div class="side" id="side"></div>
      </div>
    </section>
  </main>

  <!-- 设置弹窗 -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>AI 设置（用于“物体替换 / AI 修复背景”，可选）</h3>
        <button class="btn ghost small" id="closeSettings">✕</button>
      </div>
      <p class="note">密钥仅保存在本机浏览器（localStorage），并在请求时通过本站后端转发给对应厂商，不会持久化到服务器。不使用 AI 功能时（文字提取、基础文字修改）无需填写。</p>
      <label>服务商
        <select id="setProvider">
          <option value="openai">OpenAI（gpt-image-1 / DALL·E）</option>
          <option value="stability">Stability AI（SDXL Inpaint）</option>
        </select>
      </label>
      <label>调用方式
        <select id="setMode">
          <option value="proxy">本站代理（推荐，随服务器部署，避免 CORS）</option>
          <option value="direct">浏览器直连 AI（适合纯静态部署）</option>
        </select>
      </label>
      <label>API Key
        <input type="password" id="setKey" placeholder="sk-... / sk-..." autocomplete="off" />
      </label>
      <label>模型（OpenAI 可留空默认 gpt-image-1）
        <input type="text" id="setModel" placeholder="gpt-image-1" />
      </label>
      <label>输出尺寸（OpenAI）
        <select id="setSize">
          <option value="1024x1024">1024x1024</option>
          <option value="1536x1024">1536x1024</option>
          <option value="1024x1536">1024x1536</option>
        </select>
      </label>
      <div class="modal-foot">
        <button class="btn primary" id="saveSettings">保存</button>
      </div>
    </div>
  </div>

  <footer class="foot">本地零依赖运行 · OCR 由 Tesseract.js 在浏览器内完成</footer>

  <script src="app.js"></script>
</body>
</html>
